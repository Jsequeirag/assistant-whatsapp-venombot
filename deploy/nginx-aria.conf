# Configuración de nginx para Aria (versión IP + HTTP, sin dominio aún).
# Copiar a: /etc/nginx/sites-available/aria  y luego activar con un symlink.
#
# Cuando tengas dominio + HTTPS, Certbot reescribe este archivo automáticamente
# para agregar el bloque de SSL (puerto 443) y la redirección http→https.

server {
    listen 80;
    listen [::]:80;

    # "_" = responde a cualquier nombre/host (sirve para entrar por la IP).
    # Cuando tengas dominio, cambiá esto por: server_name aria.tudominio.com;
    server_name _;

    # Carpeta donde quedó el build del frontend (Vite).
    root /var/www/aria/fe/dist;
    index index.html;

    # 12M cubre un adjunto de 8 MB en Base64 (~11 MB). El FE corta en 8 MB.
    client_max_body_size 12M;

    # Candado del panel + /api. Crear usuario:
    #   apt install -y apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd-aria aria
    auth_basic "Aria";
    auth_basic_user_file /etc/nginx/.htpasswd-aria;

    # El frontend es una SPA: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas al API van al backend Express (bot/index.js) en el puerto 3000.
    # El token (mismo que ARIA_API_TOKEN en be/.env) lo inyecta nginx: las <img>
    # de /api/media no pueden mandar headers. Ver deploy/aria-api-token.conf.example.
    location /api/ {
        include /etc/nginx/snippets/aria-api-token.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
