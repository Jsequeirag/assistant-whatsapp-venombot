# Configuración de nginx para Aria (versión IP + HTTP, sin dominio aún).
# Copiar a: /etc/nginx/sites-available/aria  y luego activar con un symlink.
#
# Cuando tengas dominio + HTTPS, Certbot reescribe este archivo automáticamente
# para agregar el bloque de SSL (puerto 443) y la redirección http→https.

server {
    listen 80;
    listen [::]:80;

    # "_" = responde a cualquier nombre/host (sirve para entrar por la IP).
    # Cuando tengas dominio, cambiá esto por: server_name aria.tudominio.com;
    server_name _;

    # Carpeta donde quedó el build del frontend (Vite).
    root /var/www/aria/fe/dist;
    index index.html;

    # Tamaño máximo de subida (por si se envían imágenes desde el panel).
    client_max_body_size 10M;

    # El frontend es una SPA: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas al API van al backend Express (bot/index.js) en el puerto 3000.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
